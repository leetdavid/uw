<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>Command bar</title>
    <style>
      :root {
        --card: #fff;
        --text: #1e1b2e;
        --text2: #4a4760;
        --muted: #77748c;
        --line: rgba(30, 27, 46, 0.09);
        --field: #f2f1f8;
        --primary: #3b5bdb;
        --error: #d93025;
        --unit-ink: #6e6a85;
        --operator-ink: #aba8bc;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card: #171717;
          --text: #ededed;
          --text2: #c4c4c4;
          --muted: #8f8f8f;
          --line: rgba(255, 255, 255, 0.09);
          --field: #262626;
          --primary: #8da2fb;
          --error: #f28b82;
          --unit-ink: #aba7c2;
          --operator-ink: #6f6b88;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        background: var(--card);
        color: var(--text);
        font: 13px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        width: 640px;
      }

      /* Over frosted glass while the window's glass is on. */
      body.frosted {
        background: rgb(255 255 255 / 85%);
      }
      @media (prefers-color-scheme: dark) {
        body.frosted {
          background: rgb(23 23 23 / 85%);
        }
      }
      html:has(> body.frosted) {
        background: transparent;
      }

      svg {
        fill: none;
        flex: none;
        height: 16px;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.75;
        width: 16px;
      }

      kbd {
        align-items: center;
        background: var(--field);
        border-radius: 5px;
        color: var(--text2);
        display: inline-flex;
        font: 500 11px ui-monospace, 'SF Mono', Menlo, monospace;
        gap: 3px;
        padding: 1px 5px;
      }

      kbd svg {
        height: 11px;
        width: 11px;
      }

      #query {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        height: 56px;
        padding: 0 16px 0 18px;
      }

      #query > svg {
        color: var(--muted);
        height: 20px;
        width: 20px;
      }

      #line {
        flex: 1;
        font-size: 18px;
        letter-spacing: -0.005em;
        min-width: 0;
        position: relative;
      }

      #field,
      #ink {
        font: inherit;
        letter-spacing: inherit;
      }

      #field {
        background: transparent;
        border: none;
        caret-color: var(--text);
        color: transparent;
        outline: none;
        padding: 0;
        position: relative;
        width: 100%;
      }

      #ink {
        inset: 0;
        overflow: hidden;
        position: absolute;
        white-space: pre;
      }

      #ink .filled {
        color: var(--muted);
      }

      #field::placeholder {
        color: var(--muted);
      }

      #chip {
        align-items: center;
        background: var(--field);
        border-radius: 8px;
        display: flex;
        flex: none;
        font-size: 13px;
        font-weight: 500;
        height: 26px;
        padding: 0 10px;
      }

      #chip[hidden] {
        display: none;
      }

      #chip.shell {
        background: var(--text);
        color: var(--card);
        font: 700 15px ui-monospace, 'SF Mono', Menlo, monospace;
        justify-content: center;
        padding: 0;
        width: 26px;
      }

      #chip.shell + #line {
        font: 17px ui-monospace, 'SF Mono', Menlo, monospace;
      }

      #results {
        list-style: none;
        padding: 6px 8px 8px;
      }

      #results:empty {
        display: none;
      }

      #results li {
        align-items: center;
        border-radius: 10px;
        cursor: default;
        display: flex;
        font-size: 14px;
        gap: 12px;
        height: 40px;
        padding: 0 10px;
      }

      #results li.selected {
        background: var(--field);
      }

      .icon {
        color: var(--text2);
        display: grid;
        flex: none;
        height: 20px;
        place-items: center;
        width: 20px;
      }

      .icon img {
        border-radius: 4px;
        height: 16px;
        width: 16px;
      }

      .title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #results li:first-child .title {
        font-weight: 600;
      }

      .detail {
        color: var(--muted);
        flex: 1;
        font-size: 13px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .kind {
        color: var(--muted);
        flex: none;
        font-size: 12px;
        text-align: right;
        width: 64px;
      }

      #results li.selected .kind {
        color: var(--text2);
      }

      #calc {
        background: var(--field);
        border-radius: 12px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin: 8px 8px 0;
        position: relative;
      }

      #calc[hidden] {
        display: none;
      }

      #calc.selected {
        box-shadow: 0 0 0 2px var(--primary);
      }

      #calc > div {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 124px;
        justify-content: center;
        min-width: 0;
        padding: 0 20px;
        text-align: center;
      }

      #calc > div + div {
        border-left: 1px solid var(--line);
      }

      #sum,
      #answer {
        font-variant-numeric: tabular-nums;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #sum {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      #answer {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      #answer.date {
        font-size: 22px;
        letter-spacing: -0.01em;
      }

      #answer.datetime {
        font-size: 19px;
        letter-spacing: -0.01em;
      }

      #calc.no #answer {
        color: var(--text2);
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0;
      }

      .ink-unit {
        color: var(--unit-ink);
      }

      .ink-operator {
        color: var(--operator-ink);
      }

      .ink-aside {
        color: var(--operator-ink);
        text-decoration: underline dotted 1.5px;
        text-underline-offset: 5px;
      }

      .pill {
        background: var(--card);
        border-radius: 7px;
        box-shadow: 0 0 0 1px var(--line);
        color: var(--text2);
        font-size: 12px;
        font-weight: 500;
        height: 22px;
        line-height: 22px;
        max-width: 100%;
        overflow: hidden;
        padding: 0 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #calc.no #answerName {
        color: var(--error);
      }

      #arrow {
        background: var(--card);
        border-radius: 50%;
        box-shadow: 0 0 0 1px var(--line);
        color: var(--text2);
        display: grid;
        height: 28px;
        left: 50%;
        margin: -14px 0 0 -14px;
        place-items: center;
        position: absolute;
        top: 50%;
        width: 28px;
      }

      #arrow svg {
        height: 14px;
        width: 14px;
      }

      #calcNote {
        color: var(--muted);
        font-size: 12px;
        padding: 8px 18px 0;
      }

      #calcNote[hidden] {
        display: none;
      }

      #keys {
        align-items: center;
        border-top: 1px solid var(--line);
        color: var(--muted);
        display: flex;
        font-size: 12px;
        gap: 16px;
        height: 36px;
        padding: 0 16px;
      }

      #keys span {
        align-items: center;
        display: flex;
        gap: 6px;
      }

      #keys.shell .rows,
      #keys:not(.shell) .run {
        display: none;
      }

      #keys:not(.typing) .typed {
        display: none;
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <symbol id="search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </symbol>
        <symbol id="arrow-right" viewBox="0 0 24 24">
          <path d="M5 12h14m-7-7 7 7-7 7"/>
        </symbol>
        <symbol id="no-answer" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/>
        </symbol>
        <symbol id="enter" viewBox="0 0 24 24">
          <path d="M9 10 4 15l5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/>
        </symbol>
      </defs>
    </svg>
    <div id="query">
      <svg><use href="#search"/></svg>
      <span id="chip" hidden></span>
      <div id="line">
        <div id="ink" aria-hidden="true"></div>
        <input id="field" spellcheck="false" autocomplete="off"
            placeholder="Search tabs, tasks, commands, or the web">
      </div>
      <kbd>esc</kbd>
    </div>
    <div id="calc" role="option" hidden>
      <div>
        <span id="sum"></span>
        <span id="sumName" class="pill"></span>
      </div>
      <div>
        <span id="answer"></span>
        <span id="answerName" class="pill"></span>
      </div>
      <span id="arrow"><svg><use id="arrowIcon" href="#arrow-right"/></svg></span>
    </div>
    <div id="calcNote" hidden></div>
    <ul id="results" role="listbox"></ul>
    <div id="keys">
      <span class="typed rows">
        <kbd><svg><use href="#enter"/></svg></kbd>
        <span id="action">Open</span>
      </span>
      <span class="typed rows">
        <kbd>Cmd <svg><use href="#enter"/></svg></kbd> Ask uw
      </span>
      <span class="typed rows">
        <kbd>Option <svg><use href="#enter"/></svg></kbd> Run in terminal
      </span>
      <span class="run">
        <kbd><svg><use href="#enter"/></svg></kbd> Run in terminal
      </span>
    </div>
    <script src="/math.js"></script>
    <script type="module" src="/problems.js"></script>
    <script type="module" src="/command_bar.js"></script>
  </body>
</html>
