<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light dark">
    <title>Terminal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
      html,
      body {
        background: #fff;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0a0a0a;
        }
      }

      /* ghostty-web turns the pointer into a hand on any address; it is a
         hand only while Cmd is held, when a click opens it. */
      #terminal,
      #terminal canvas {
        cursor: text !important;
      }

      body.cmd-link #terminal,
      body.cmd-link #terminal canvas {
        cursor: pointer !important;
      }

      #terminal {
        box-sizing: border-box;
        caret-color: transparent;
        height: 100%;
        outline: none;
        padding: 8px 0 8px 12px;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script type="module" src="/problems.js"></script>
    <script type="module" src="/terminal.js"></script>
  </body>
</html>
